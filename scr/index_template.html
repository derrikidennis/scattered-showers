<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>/*__LEAFLET_CSS__*/</style>
<style>
:root{color-scheme:dark;--bg:#15141b;--card:#1c1b25;--card2:#232230;--ink:#edecee;--mute:#8f8ca3;--line:#2e2c3b;--grid:#2a2837;--mint:#61ffca;--gold:#ffca85;--hot:#ff6767;--pink:#f694ff;--cool:#82e2ff;--purple:#a277ff;--storm:#7aa2ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
@font-face{font-family:"Inter";src:url(data:font/woff2;base64,__INTER_400_B64__) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(data:font/woff2;base64,__INTER_600_B64__) format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(data:font/woff2;base64,__INTER_700_B64__) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Nunito Title";src:url(data:font/woff2;base64,__NUNITO_B64__) format("woff2");font-weight:800;font-style:normal;font-display:swap}
.masthead{text-align:center;padding:26px 0 16px;position:relative}
h1{font-family:"Nunito Title","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;font-size:clamp(24px,6vw,32px);line-height:1.15;margin:0 0 4px;font-weight:800;letter-spacing:.3px;color:var(--storm)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sub{color:var(--mute);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.sel{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--card);color:var(--mute);border:0;padding:8px 14px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{color:var(--ink);background:var(--card2);box-shadow:inset 0 -2px 0 var(--purple)}
button:focus-visible,select:focus-visible,.hit:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
h2{font-size:15px;margin:30px 0 10px;font-weight:650;color:var(--ink)}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.charts{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))}
@media(max-width:560px){.charts{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.st{border-top:3px solid var(--c,var(--purple))}
.st .name{font-weight:650;font-size:15px}
.st.go{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.st.go:hover{border-color:var(--c,var(--purple));box-shadow:0 2px 10px rgba(0,0,0,.12)}
.st.go:focus-visible{outline:2px solid var(--c,var(--purple));outline-offset:2px}
.pill{display:inline-block;max-width:100%;font-size:12px;padding:2px 8px;border-radius:12px;border:1px solid var(--line);color:var(--ink);white-space:normal}
.pill.ok{color:var(--mint)} .pill.warn{color:var(--gold)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:8px;vertical-align:1px}
.dot.tri{width:auto;height:auto;border-radius:0;background:none;color:var(--gold);font-size:11px;line-height:1;vertical-align:1px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px}
.big{font-size:44px;line-height:1;font-weight:600;margin:12px 0 2px;letter-spacing:-1px}
.big small{font-size:18px;color:var(--mute);margin-left:2px;font-weight:400}
.trend{font-size:13px;color:var(--mute)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin-top:12px}
.kv div span{display:block;color:var(--mute);font-size:12px}
.kv div b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .snowpar{font-style:normal;font-size:13px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.cardhead h3{margin:0;font-size:14px;font-weight:650}
.tbtn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.tbtn:hover{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c)}
.legend i.dash{border-top-style:dashed}
.legend i.box{width:10px;height:10px;border:0;background:var(--c);border-radius:2px}
.chartbox{position:relative}
svg:not(.leaflet-container svg){display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--mute);font-size:11px}
svg .lbl{font-size:11.5px;fill:var(--ink)}
.tip{position:absolute;pointer-events:none;background:#0f0e14;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;box-shadow:0 6px 20px #0008;z-index:4;display:none}
.tip .t{color:var(--mute);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r em{font-style:normal;display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.tip .r em i{display:inline-block;width:12px;border-top:2px solid var(--c)}
.tip .r b{font-size:13px;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
.scroll{overflow:auto;max-height:340px}
.fc{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hr{display:flex;gap:2px;overflow-x:auto;padding:12px 8px 10px;background:var(--card);border-radius:12px;cursor:grab;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior-x:contain}
.hr.drag{cursor:grabbing;user-select:none}
.hr .h{flex:0 0 66px;text-align:center;padding:4px 0;border-radius:8px}
.hr .h.day{border-left:1px solid var(--line);margin-left:4px;padding-left:4px}
.hr .t{font-size:12.5px;color:var(--mute);white-space:nowrap}
.hr .day .t{color:var(--ink);font-weight:650}
.hr .ic{display:block;width:34px;height:34px;margin:4px auto}
.hr .v{font-size:17px;font-weight:400}
.hr .p{font-size:12px;color:var(--cool);min-height:16px}
.hr .w{font-size:11.5px;color:var(--mute);white-space:nowrap}
.fc .d{font-weight:650}
.fc .hl{font-size:22px;font-weight:300;margin:4px 0}
.fc .hl small{color:var(--mute);font-size:15px}
.fc p{margin:6px 0 0;color:var(--mute);font-size:12.5px}
.note{color:var(--mute);font-size:12.5px;margin-top:6px}
.actions{position:absolute;right:0;top:26px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-wrap:nowrap;max-width:40%}
.actions .stat{display:flex;flex-wrap:wrap;justify-content:flex-end;column-gap:12px;row-gap:2px;text-align:right}
.actions .stat .upd{white-space:nowrap}
.actions .stat .upd.warn{white-space:normal}
.actions .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#refreshMsg{text-align:right}
/* the header grows only while a long note is showing, so nothing slides behind the header line */
.masthead:has(#refreshMsg:not(:empty)){padding-bottom:54px}
.masthead:has(.upd.warn){padding-bottom:56px}
.masthead:has(#refreshMsg:not(:empty)):has(.upd.warn){padding-bottom:96px}
@media(max-width:900px){.actions{position:static;max-width:none;align-items:center;margin:12px 0 0}.actions .stat{justify-content:center;text-align:center}#refreshMsg{text-align:center}
  .masthead:has(#refreshMsg:not(:empty)),.masthead:has(.upd.warn),.masthead:has(#refreshMsg:not(:empty)):has(.upd.warn){padding-bottom:16px}}
.act{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.act:hover{border-color:var(--purple)}
.act:disabled{opacity:.6;cursor:wait}
.upd{font-size:12.5px;color:var(--mute);white-space:nowrap}
.upd.warn{color:var(--gold);white-space:normal}
/* ---- weather alerts (colors come from the NWS guide, set in the data) ---- */
.apill{margin-left:auto;font:inherit;font-weight:600;font-size:12.5px;padding:3px 10px;border-radius:999px;border:0;white-space:nowrap;cursor:pointer}
.alerts{margin:0 0 14px;display:grid;gap:8px}
.alerts:empty{display:none}
.alertbox{border-radius:10px;overflow:hidden}
.alertbox summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.alertbox summary::-webkit-details-marker{display:none}
.alertbox .at{font-weight:500;font-size:13px;opacity:.92}
.alertbox .abody{padding:0 14px 12px;font-size:14px}
.alertbox .abody h4{margin:10px 0 2px;font-size:14px}
.alertbox .abody p{margin:0 0 6px}
#refreshMsg{font-size:12.5px;color:var(--mute);max-width:420px}
#refreshMsg.err{color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:14px}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.tile .gz{display:block;width:100%;max-width:124px;height:auto;margin:6px auto 12px}
.tile .gz text{font-size:9px;fill:var(--mute)}
.fc .ic{display:block;width:52px;height:52px;margin-bottom:6px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;display:flex;flex-direction:column;justify-content:flex-start;color:var(--ink);font:inherit}
.tile:hover{border-color:var(--mute)}
.tile[aria-pressed=true]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.tile:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.tile span{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:center}
.tile b{display:block;font-size:19px;font-weight:600;margin-top:0;text-align:center;white-space:nowrap}
.tile small{display:block;color:var(--mute);font-size:12px;margin-top:2px;min-height:1.2em;text-align:center}
.grid.one{grid-template-columns:1fr}
footer{margin-top:36px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
.dim{opacity:.55}
.fpanel{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fbtn{display:none}
.datewrap{position:relative}
.datepop{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:6;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;gap:12px;flex-wrap:wrap;align-items:flex-end;min-width:280px;box-shadow:0 6px 20px #0008}
.datepop.open{display:flex}
.datepop label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:12px}
input[type=date]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color-scheme:dark}
input[type=date]:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.seg button[aria-pressed=false].on{color:var(--ink)}
.scroll.tall{max-height:640px}
.dayrow{cursor:pointer}
.dayrow:hover td{background:var(--card2)}
.rowbtn{all:unset;cursor:pointer;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.rowbtn:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.rowbtn i{font-style:normal;color:var(--mute);width:10px}
.det td{white-space:normal;background:var(--card2);padding:14px 12px}
.wu{display:flex;flex-wrap:wrap;gap:18px}
.wu table{flex:1 1 280px;min-width:260px}
.wu th{position:static;background:transparent}
.wu td:first-child{font-weight:600}
@media(max-width:700px){
  .fbtn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;flex:1 1 auto;order:1;text-align:left}
  .fpanel{display:none;order:3;width:100%;flex-direction:column;align-items:stretch}
  .fpanel.open{display:flex}
  .fpanel select{min-width:0;width:100%}
  .fpanel .seg{display:grid;grid-template-columns:repeat(2,1fr)}
  .fpanel .seg button{border-bottom:1px solid var(--line)}
  #dateBtn{display:none}
  .datewrap{position:static}
  .datepop{display:flex;position:static;box-shadow:none;border:0;padding:0;min-width:0}
}

/* ---- radar ---- */
.leaflet-container{background:#0e0d13;font:inherit}
.rd .rd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.rd .rd-head h3{margin:0;font-size:16px}
.rd .rd-time{color:var(--mute);font-size:13.5px}
.rd .rd-time b{color:var(--ink);font-weight:600}
.rd .rd-grow{flex:1}
.rd .rd-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.rd .rd-ctl label{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px}
.rd button,.rd select{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.rd select{background:var(--card2)}
.rd button:hover,.rd select:hover{border-color:var(--mute)}
.rd input[type=range]{flex:1;min-width:140px;accent-color:var(--storm)}
.rd .rd-map{height:380px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;isolation:isolate}
.rd.fs .rd-map{cursor:grab}
.card.rd.fs{position:fixed;inset:0;z-index:1000;border-radius:0;display:flex;flex-direction:column;padding:12px;margin:0}
.rd.fs .rd-map{flex:1;height:auto;border-radius:0}
.rd .rd-msg{color:var(--gold);font-size:12.5px;margin-top:8px}
.leaflet-control-attribution{background:rgba(21,20,27,.85)!important;color:var(--mute)!important;font-size:11px}
.leaflet-control-attribution a{color:var(--cool)!important}
/* ---- the animation. Each effect is slow and small. Everything stops under "reduce motion" or the button ---- */
.ic .rays{transform-box:fill-box;transform-origin:center;animation:rd-spin 40s linear infinite}
.ic .cl{animation:rd-drift 7s ease-in-out infinite alternate}
.ic .cl.b{animation-duration:9s;animation-delay:-3s}
.ic .drop{animation:rd-fall 1.3s linear infinite}
.ic .flake{animation:rd-snow 3.2s ease-in-out infinite}
.ic .bolt{animation:rd-bolt 5s linear infinite}
.ic .moon{animation:rd-glow 6s ease-in-out infinite alternate}
.ic .fogl{animation:rd-slide 6s ease-in-out infinite alternate}
.ic .windl{animation:rd-slide 3s ease-in-out infinite alternate}
@keyframes rd-spin{to{transform:rotate(360deg)}}
@keyframes rd-drift{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes rd-fall{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(4px);opacity:0}}
@keyframes rd-snow{0%{transform:translate(-1px,-3px);opacity:0}25%{opacity:1}100%{transform:translate(1.5px,4px);opacity:0}}
@keyframes rd-bolt{0%,62%,100%{opacity:1}66%{opacity:.15}70%{opacity:1}74%{opacity:.3}80%{opacity:1}}
@keyframes rd-glow{from{opacity:.78}to{opacity:1}}
@keyframes rd-slide{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.still .ic *{animation:none!important}
@media (prefers-reduced-motion:reduce){.ic *{animation:none!important}}
.rd-leg{background:rgba(21,20,27,.9);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;color:var(--ink);line-height:1.5}
.rd-leg .sw{display:inline-block;width:28px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}
.rd-leg small{display:block;color:var(--mute);margin-top:2px;font-size:11px}
.leaflet-tooltip{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.leaflet-bar a{background:var(--card2);color:var(--ink);border-bottom-color:var(--line)}
@media (max-width:600px){.rd .rd-map{height:300px}}
</style>
</head>
<body>
<div class="wrap">
<div class="masthead">
  <h1>Scattered Showers</h1>
  <div class="sub" id="stationsLine"></div>
  <div class="actions"><div class="btns"><button class="act" id="guideBtn" type="button">How To Guide</button><button class="act" id="refreshBtn" type="button">&#x21BB; Refresh data</button></div><div class="stat"><span id="alertAt" class="upd"></span><span id="updAt" class="upd"></span></div><span id="refreshMsg" role="status"></span></div>
</div>
<header>
  <div class="filters">
    <button class="act fbtn" id="fbtn" type="button" aria-expanded="false" aria-controls="fpanel"></button>
    <div class="fpanel" id="fpanel">
      <label class="sel">Station <select id="stSel" aria-label="Station"></select></label>
      <div class="seg" id="rangeSeg" role="group" aria-label="Time range"></div>
      <div class="datewrap">
        <button class="act" id="dateBtn" type="button" aria-expanded="false" aria-controls="datePop">Pick dates</button>
        <div class="datepop" id="datePop">
          <label>From <input type="date" id="dFrom"></label>
          <label>To <input type="date" id="dTo"></label>
          <button class="tbtn" id="dClear" type="button">Back to today</button>
        </div>
      </div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status"></div>
<script>/*__LEAFLET_JS__*/</script>
<script>
const DATA = /*__DATA__*/null;
const NS = "http://www.w3.org/2000/svg";
const RANGES = [["today","Today"],["24h","Last 24 hours"],["7d","Last 7 days"],["30d","Last 30 days"],["all","Everything saved"]];
const state = {station:"all", range:"today", from:null, to:null, metric:"temp"};
const tipEl = document.getElementById("tip");
const ST = DATA.stations;
/* A live reading (saved by the collector) replaces the Right now numbers only when it is newer than the newest saved history reading. */
function feelsFrom(t,w,hi,wc){ if(t!=null&&t>=80&&hi!=null) return hi; if(t!=null&&t<=50&&(w||0)>3&&wc!=null) return wc; return t; }
(function applyLive(){
  const lv=DATA.live||{};
  ST.forEach(s=>{
    const v=lv[s.id], L=s.latest; if(!v||v.epoch==null||v.epoch<=L.epoch||v.temp==null) return;
    L.epoch=v.epoch; if(v.local) L.local=v.local;
    L.temp=v.temp; L.feels=feelsFrom(v.temp,v.windSpeed,v.heatIndex,v.windChill);
    L.hum=v.humidity; L.wind=v.windSpeed; L.gust=v.windGust; L.dir=v.winddir; L.press=v.pressure;
    L.rainRate=v.precipRate; L.rainToday=v.precipTotal; if(v.uv!=null) L.uv=v.uv;
    if(L.todayHi!=null&&v.temp>L.todayHi) L.todayHi=v.temp; if(L.todayLo!=null&&v.temp<L.todayLo) L.todayLo=v.temp;
    if(L.todayGust!=null&&v.windGust!=null&&v.windGust>L.todayGust) L.todayGust=v.windGust;
    /* Today's row in the daily summary: the most extreme of history and live wins (high, low, gust); rain takes the bigger total. Averages stay on history. */
    const dd=s.daily.find(x=>x.date===(v.local||"").slice(0,10));
    if(dd){
      if(dd.hi==null||v.temp>dd.hi) dd.hi=v.temp;
      if(dd.lo==null||v.temp<dd.lo) dd.lo=v.temp;
      if(v.windGust!=null){ if(dd.gust==null||v.windGust>dd.gust) dd.gust=v.windGust; if(dd.gHi==null||v.windGust>dd.gHi) dd.gHi=v.windGust; }
      if(v.precipTotal!=null&&v.precipTotal>(dd.rain||0)) dd.rain=v.precipTotal;
    }
    s.liveUsed=true;
  });
})();
const color = {}; ST.forEach((s,i)=>color[s.id]=DATA.colors[i%DATA.colors.length]);
const short = s => { let l=s.label; const m=l.match(/\(([^)]+)\)/); if(m) l=m[1]; return l.replace(/,\s*[A-Z]{2}$/,""); };
const byId = id => ST.find(s=>s.id===id);
const NOW = Math.max(...ST.map(s=>s.latest.epoch));
const BUILT = Date.parse(DATA.built)/1000;

const HOME_TZ = ST[0].tz;
function hhmm(ep,tz){ return new Date(ep*1000).toLocaleTimeString([], {hour:"numeric",minute:"2-digit",timeZone:tz||HOME_TZ}); }
function dayLbl(ep,tz){ return new Date(ep*1000).toLocaleDateString([], {weekday:"short",month:"numeric",day:"numeric",timeZone:tz||HOME_TZ}); }

function localHour(t,tz){ return +new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",hourCycle:"h23"}).format(new Date(t*1000)); }
function ageText(min){ if(min<1) return "just now"; if(min<90) return Math.round(min)+" min ago"; if(min<2880) return (min/60).toFixed(1)+" hours ago"; return Math.round(min/1440)+" days ago"; }

/* ---------- data selection ---------- */
/* Each station has its own clock, so "today" starts at that station's own midnight. */
function tzOff(ep,tz){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(ep*1000)).reduce((o,x)=>(o[x.type]=x.value,o),{});
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)/1000-ep;
}
function dateInTz(ep,tz){ return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(ep*1000)); }
function addDays(ds,n){ const [y,m,d]=ds.split("-").map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }
function dayStart(ds,tz){ const [y,m,d]=ds.split("-").map(Number); const g=Date.UTC(y,m-1,d)/1000; let e=g-tzOff(g,tz); e=g-tzOff(e,tz); return e; }
/* Readings a full local day should have at one every 5 minutes. 288 normally, 276 when clocks spring forward, 300 when they fall back. */
function dayReadings(ds,tz){ return Math.round((dayStart(addDays(ds,1),tz)-dayStart(ds,tz))/300); }
function win(s){
  const r=state.range, tz=s.tz;
  if(r==="today") return {a:dayStart(dateInTz(NOW,tz),tz), b:Infinity};
  if(r==="24h") return {a:NOW-86400, b:Infinity};
  if(r==="7d") return {a:NOW-7*86400, b:Infinity};
  if(r==="30d") return {a:NOW-30*86400, b:Infinity};
  if(r==="custom") return {a:dayStart(state.from,tz), b:dayStart(addDays(state.to,1),tz)};
  return {a:0, b:Infinity};
}
/* Short ranges (3 days or less) use the 5-minute readings when we still have them, longer ranges use hourly averages. */
function useRecent(s){
  const w=win(s), span=(Math.min(w.b,NOW)-w.a)/86400;
  return s.recent.length>0 && span<=3.05 && w.a>=s.recent[0][0]-3600;
}
function pointsFor(s, idx){
  const src = useRecent(s) ? s.recent : s.hourly, w=win(s);
  return src.filter(r=>r[0]>=w.a && r[0]<w.b).map(r=>[r[0], r[idx]]);
}
const gapSec = s => useRecent(s) ? 30*60 : 2.5*3600;
function dailyFor(s){
  const d=s.daily, r=state.range;
  if(r==="today") return d.filter(x=>x.date===dateInTz(NOW,s.tz));
  if(r==="24h") return d.slice(-2);
  if(r==="7d") return d.slice(-7);
  if(r==="30d") return d.slice(-30);
  if(r==="custom") return d.filter(x=>x.date>=state.from && x.date<=state.to);
  return d;
}

/* ---------- chart pieces ---------- */
function niceTicks(lo,hi,n){
  if(lo===hi){ lo-=1; hi+=1; }
  const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(Math.round(v/step)*step);
  return {ticks:out, step};
}
function xTicks(x0,x1,tz){
  tz=tz||HOME_TZ; const span=x1-x0, out=[], off0=tzOff(x0,tz), first=Math.ceil((x0+off0)/3600)*3600-off0; /* first tick lands on the station's own whole hour, also in zones that sit on a half hour */
  if(span<=3*86400){
    const stepH = span<=8*3600 ? 1 : span<=14*3600 ? 2 : span<=27*3600 ? 3 : 6;
    for(let t=first; t<=x1; t+=3600){ const h=localHour(t,tz); if(h%stepH===0){
      /* when clocks fall back, one local hour happens twice: say which one (EDT or EST) */
      const twice=localHour(t-3600,tz)===h || localHour(t+3600,tz)===h;
      const lab=h===0? dayLbl(t,tz) : new Date(t*1000).toLocaleTimeString([], {hour:"numeric",timeZone:tz})+(twice?" "+zoneAbbr(t,tz):"");
      out.push([t, lab]); } }
  } else {
    const mids=[]; for(let t=first; t<=x1; t+=3600) if(localHour(t,tz)===0) mids.push(t);
    const days=Math.ceil(span/86400), step=Math.max(1,Math.ceil(days/8));
    mids.forEach((t,i)=>{ if(i%step===0) out.push([t, new Date(t*1000).toLocaleDateString([], {month:"numeric",day:"numeric",timeZone:tz})]); });
  }
  return out;
}
/* phone fix: keep the day labels first, then add time labels only where they fit without touching anything already kept */
function thinTicks(ticks,X){
  if(ticks.length<3) return ticks;
  const GAP=8, wOf=lb=>lb.length*6.4, isTime=lb=>/\d\s?[AP]M/i.test(lb)&&lb.indexOf("/")<0;
  const kept=[]; const fits=i=>{ const x=X(ticks[i][0]), w=wOf(ticks[i][1])/2; return kept.every(j=>{ const xj=X(ticks[j][0]), wj=wOf(ticks[j][1])/2; return Math.abs(x-xj)>=w+wj+GAP; }); };
  ticks.forEach((tk,i)=>{ if(!isTime(tk[1]) && fits(i)) kept.push(i); });
  ticks.forEach((tk,i)=>{ if(isTime(tk[1]) && fits(i)) kept.push(i); });
  return kept.sort((a,b)=>a-b).map(i=>ticks[i]);
}
function showTip(host, x, y, title, rows){
  tipEl.replaceChildren();
  tipEl.appendChild(el("div","t",title));
  rows.forEach(r=>{ const row=el("div","r"); const k=el("em"); const i=el("i"); i.style.setProperty("--c",r.color); if(r.dash) i.style.borderTopStyle="dashed"; k.appendChild(i); k.appendChild(document.createTextNode(r.name)); row.appendChild(k); row.appendChild(el("b",null,r.value)); tipEl.appendChild(row); });
  tipEl.style.display="block";
  const hb=host.getBoundingClientRect(), tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
  let left=x+hb.left+window.scrollX+14, top=y+hb.top+window.scrollY-th/2;
  if(x+14+tw>hb.width) left=x+hb.left+window.scrollX-tw-14;
  tipEl.style.position="absolute"; tipEl.style.left=left+"px"; tipEl.style.top=Math.max(8,top)+"px";
}
function hideTip(){ tipEl.style.display="none"; }
function legend(items){
  const l=el("div","legend");
  items.forEach(it=>{ const s=el("span"); const i=el("i", it.box?"box":(it.dash?"dash":"")); i.style.setProperty("--c",it.color); s.appendChild(i); s.appendChild(document.createTextNode(it.name)); l.appendChild(s); });
  return l;
}

function lineChart(host, o){
  const W=Math.max(300,host.clientWidth||700), H=250, m={l:46,r:o.series.length>1?84:16,t:10,b:26};
  const all=o.series.flatMap(s=>s.pts.filter(p=>p[1]!=null));
  if(!all.length){ host.appendChild(el("div","note","No readings in this range.")); return; }
  let x0=Math.min(...all.map(p=>p[0])), x1=Math.max(...all.map(p=>p[0]));
  let y0=Math.min(...all.map(p=>p[1])), y1=Math.max(...all.map(p=>p[1]));
  const pad=(y1-y0||1)*0.1; y0-=pad; y1+=pad; if(o.zero&&y0>0) y0=0; if(o.zero&&y0<0) y0=0;
  const nt=niceTicks(y0,y1,4); y0=Math.min(y0,nt.ticks[0]); y1=Math.max(y1,nt.ticks[nt.ticks.length-1]);
  const X=t=>m.l+(t-x0)/((x1-x0)||1)*(W-m.l-m.r), Y=v=>m.t+(1-(v-y0)/((y1-y0)||1))*(H-m.t-m.b);
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":o.title+" over time"});
  nt.ticks.forEach(v=>{ svg.appendChild(sv("line",{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:"var(--grid)","stroke-width":1})); const t=sv("text",{x:m.l-8,y:Y(v)+4,"text-anchor":"end"}); t.textContent=(o.tickFmt||fmt0)(v); svg.appendChild(t); });
  thinTicks(xTicks(x0,x1,o.tz),X).forEach(([t,lb])=>{ const x=X(t); svg.appendChild(sv("line",{x1:x,x2:x,y1:m.t,y2:H-m.b,stroke:"var(--grid)","stroke-width":1})); const tx=sv("text",{x:x,y:H-8,"text-anchor":"middle"}); tx.textContent=lb; svg.appendChild(tx); });
  const ends=[];
  o.series.forEach(s=>{
    let d="", prev=null;
    s.pts.forEach(p=>{ if(p[1]==null){prev=null;return;} d+=(prev===null||p[0]-prev>o.gap?"M":"L")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)+" "; prev=p[0]; });
    svg.appendChild(sv("path",{d:d,fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round","stroke-dasharray":s.dash?"6 4":"none"}));
    if(o.markers) s.pts.forEach(p=>{ if(p[1]!=null) svg.appendChild(sv("circle",{cx:X(p[0]),cy:Y(p[1]),r:4,fill:s.color,stroke:"var(--card)","stroke-width":2})); });
    const last=[...s.pts].reverse().find(p=>p[1]!=null); if(last&&o.series.length>1) ends.push({s:s,y:Y(last[1])});
  });
  ends.sort((a,b)=>a.y-b.y); for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;
  ends.forEach(e=>{ const t=sv("text",{x:W-m.r+8,y:e.y+4,class:"lbl"}); t.textContent=e.s.short||e.s.name; svg.appendChild(t); });
  const cross=sv("line",{y1:m.t,y2:H-m.b,stroke:"var(--mute)","stroke-width":1,"stroke-dasharray":"3 3",visibility:"hidden"}); svg.appendChild(cross);
  const dots=o.series.map(s=>{ const c=sv("circle",{r:4.5,fill:s.color,stroke:"var(--card)","stroke-width":2,visibility:"hidden"}); svg.appendChild(c); return c; });
  const ov=sv("rect",{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:"transparent",tabindex:0,class:"hit"}); svg.appendChild(ov);
  const nearest=(pts,t)=>{ let lo=0,hi=pts.length-1; while(lo<hi){ const mid=(lo+hi)>>1; if(pts[mid][0]<t) lo=mid+1; else hi=mid; } let b=lo; if(b>0&&Math.abs(pts[b-1][0]-t)<Math.abs(pts[b][0]-t)) b--; return pts[b]; };
  let kb=null;
  const show=(t)=>{
    const rows=[]; let anchor=null;
    o.series.forEach((s,i)=>{ const p=s.pts.length?nearest(s.pts,t):null; if(p&&p[1]!=null&&Math.abs(p[0]-t)<=o.gap){ dots[i].setAttribute("cx",X(p[0])); dots[i].setAttribute("cy",Y(p[1])); dots[i].setAttribute("visibility","visible"); rows.push({name:s.name,color:s.color,dash:s.dash,value:(o.valFmt||fmt1)(p[1])+(o.unit||"")}); if(!anchor||Math.abs(p[0]-t)<Math.abs(anchor-t)) anchor=p[0]; } else dots[i].setAttribute("visibility","hidden"); });
    if(anchor==null){ cross.setAttribute("visibility","hidden"); hideTip(); return; }
    cross.setAttribute("x1",X(anchor)); cross.setAttribute("x2",X(anchor)); cross.setAttribute("visibility","visible");
    showTip(host, X(anchor)*(host.clientWidth/W), H/3, o.dateOnly? dayLbl(anchor,o.tz) : stamp(anchor,o.tz)+" "+zoneAbbr(anchor,o.tz), rows);
  };
  const clear=()=>{ cross.setAttribute("visibility","hidden"); dots.forEach(d=>d.setAttribute("visibility","hidden")); hideTip(); };
  ov.addEventListener("pointermove",e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*(W/r.width); show(x0+(px-m.l)/(W-m.l-m.r)*(x1-x0)); });

function barChart(host, o){
  /* Series may carry axis:"r" (right-hand axis, used for snow), stroke (outline), and fmt (tooltip text). */
  const hasR=o.series.some(s=>s.axis==="r"), W=Math.max(300,host.clientWidth||700), H=250, m={l:46,r:hasR?46:16,t:10,b:26};
  const mx=r=>Math.max(0,...o.series.filter(s=>(s.axis==="r")===r).flatMap(s=>s.vals.map(v=>v||0)));
  const vL=mx(false), vR=mx(true);
  if(vL===0&&vR===0){ host.appendChild(el("div","note","No precipitation recorded in this range.")); return; }
  const ntL=niceTicks(0,Math.max(vL,0.05)*1.1,4), y1=Math.max(ntL.ticks[ntL.ticks.length-1],vL,0.05);
  const ntR=hasR?niceTicks(0,Math.max(vR,0.5)*1.1,4):null, y2=hasR?Math.max(ntR.ticks[ntR.ticks.length-1],vR,0.5):1;
  const Y=v=>m.t+(1-v/y1)*(H-m.t-m.b), YR=v=>m.t+(1-v/y2)*(H-m.t-m.b);
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":o.title});
  ntL.ticks.forEach(v=>{ svg.appendChild(sv("line",{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:"var(--grid)"})); const t=sv("text",{x:m.l-8,y:Y(v)+4,"text-anchor":"end"}); t.textContent=(v%1?v.toFixed(2):v); svg.appendChild(t); });
  if(hasR) ntR.ticks.forEach(v=>{ const t=sv("text",{x:W-m.r+8,y:YR(v)+4,"text-anchor":"start",fill:"#f4f6fb"}); t.textContent=(v%1?v.toFixed(1):v); svg.appendChild(t); });
  const n=o.cats.length, gw=(W-m.l-m.r)/n, k=o.series.length, bw=Math.max(3,Math.min(26,(gw*0.72-(k-1)*2)/k));
  o.cats.forEach((c,ci)=>{
    const act=o.series.map((s,i)=>(s.vals[ci]||0)>0?i:-1).filter(i=>i>=0);   // only series with a value that day are drawn, centered
    const gx=m.l+gw*ci+gw/2-(act.length*bw+(act.length-1)*2)/2;
    if(ci%Math.max(1,Math.ceil(42/gw))===0){ const t=sv("text",{x:m.l+gw*ci+gw/2,y:H-8,"text-anchor":"middle"}); t.textContent=c.slice(5).replace("-","/"); svg.appendChild(t); }
    o.series.forEach((s,si)=>{
      if(!act.includes(si)) return;
      const YY=s.axis==="r"?YR:Y;
      const v=s.vals[ci]||0, x=gx+act.indexOf(si)*(bw+2), h=Math.max(v>0?2:0,(H-m.b)-YY(v)), y=H-m.b-h, r=Math.min(4,bw/2,h);
      const p=sv("path",{d:`M${x} ${H-m.b}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${H-m.b}Z`,fill:s.color,class:"hit",tabindex:0});
      const base=()=>{ if(s.stroke&&h>0){ p.setAttribute("stroke",s.stroke); p.setAttribute("stroke-width","1.5"); } else { p.removeAttribute("stroke"); p.removeAttribute("stroke-width"); } };
      base();
      const hov=()=>{ p.setAttribute("stroke","var(--ink)"); p.setAttribute("stroke-width","1.5"); showTip(host,x+bw/2,y,mdy(c),o.tip?o.tip(ci):[{name:s.name,color:s.stroke||s.color,value:s.fmt?s.fmt(v):fmt2(v)+" in"}]); };
      p.addEventListener("pointermove",hov); p.addEventListener("focus",hov);
      const off=()=>{ base(); hideTip(); }; p.addEventListener("pointerleave",off); p.addEventListener("blur",off);

  });

}

function chartCard(o){
  const c=card(); const head=el("div","cardhead"); head.appendChild(el("h3",null,o.title));
  const tb=el("button","tbtn","Table"); tb.setAttribute("aria-pressed","false"); head.appendChild(tb); c.appendChild(head);

  tb.addEventListener("click",()=>{ tableOn=!tableOn; tb.textContent=tableOn?"Chart":"Table"; tb.setAttribute("aria-pressed",tableOn); draw(); });
  c._draw=draw; return c;

function buildTable(head,rows,wrapCls){
  const t=el("table"); const th=el("thead"); const hr=el("tr"); head.forEach(h=>hr.appendChild(el("th",null,h))); th.appendChild(hr); t.appendChild(th);
  const tb=el("tbody"); rows.forEach(r=>{ const tr=el("tr"); r.forEach(v=>tr.appendChild(el("td",null,v==null?"–":String(v)))); tb.appendChild(tr); }); t.appendChild(tb);
  if(!wrapCls) return t; const w=el("div",wrapCls); w.appendChild(t); return w;
}

/* ---------- builders for each chart ---------- */
function tableHourly(stations, idx, f){
  const hrs=new Set(); stations.forEach(s=>{ const w=win(s); s.hourly.forEach(r=>{ if(r[0]>=w.a && r[0]<w.b) hrs.add(r[0]); }); });
  const maps=stations.map(s=>{ const m=new Map(); s.hourly.forEach(r=>m.set(r[0],r)); return m; });
  return [...hrs].sort((x,y)=>y-x).slice(0,300).map(h=>[stamp(h,stations.length===1?stations[0].tz:HOME_TZ),...maps.map(m=>{ const r=m.get(h); return r?f(r[idx]):null; })]);
}
function dual(s, title, i1, n1, i2, n2, unit){
  const c=color[s.id];
  return chartCard({title:title,legend:[{name:n1,color:c},{name:n2,color:"#b5b2c4",dash:true}],
    spec:()=>({title:title,unit:unit,tz:s.tz,gap:gapSec(s),series:[{name:n1,short:n1,color:c,pts:pointsFor(s,i1)},{name:n2,short:n2,color:"#b5b2c4",dash:true,pts:pointsFor(s,i2)}]}),
    table:{head:["Hour ("+short(s)+" time)",n1+" ("+unit.trim()+")",n2+" ("+unit.trim()+")"],rows:()=>{ const w=win(s); return s.hourly.filter(r=>r[0]>=w.a && r[0]<w.b).sort((x,y)=>y[0]-x[0]).slice(0,300).map(r=>[stamp(r[0],s.tz),fmt1(r[i1]),fmt1(r[i2])]); }}});
}
function single(s, title, idx, unit, o){
  o=o||{}; const c=color[s.id];
  return chartCard({title:title,legend:[],
    spec:()=>({title:title,unit:unit,tz:s.tz,tickFmt:o.tickFmt,valFmt:o.valFmt,gap:gapSec(s),series:[{name:title,short:title,color:c,pts:pointsFor(s,idx)}]}),
    table:{head:["Hour ("+short(s)+" time)",title+" ("+unit.trim()+")"],rows:()=>tableHourly([s],idx,o.valFmt||fmt1)}});
}
function dailyRain(stations){
  const title="Precipitation per day", SNOWC="#f4f6fb";
  const dates=[...new Set(stations.flatMap(s=>dailyFor(s).map(d=>d.date)))].sort();
  const dayOf=(s,dt)=>s.daily.find(x=>x.date===dt);
  const val=(s,dt)=>{ const d=dayOf(s,dt); return d?d.rain:0; };
  const snowOf=(s,dt)=>{ const d=dayOf(s,dt); return d&&d.snow!=null&&d.snow>=SNOW_SHOW?d.snow:0; };
  const withSnow=stations.filter(s=>dates.some(dt=>snowOf(s,dt)>0));
  let legendItems=stations.length>1?stations.map(s=>({name:s.label,color:color[s.id],box:true})):[];
  if(withSnow.length){
    if(stations.length===1) legendItems=[{name:"Rain gauge, left axis",color:color[stations[0].id],box:true}];
    legendItems.push({name:"Snow, right axis (model estimate)",color:SNOWC,box:true});
  }
  const series=stations.flatMap(s=>{
    const out=[{name:s.label,color:color[s.id],vals:dates.map(dt=>val(s,dt))}];
    if(withSnow.includes(s)) out.push({name:"Snow (model estimate)",color:SNOWC,stroke:color[s.id],axis:"r",fmt:v=>snowStr(v)+" in",vals:dates.map(dt=>snowOf(s,dt))});
    return out;
  });

    spec:()=>({title:title,cats:dates,series:series,tip:stations.length!==1?null:(ci=>{

const DAYSTATE=new Map();   // date -> opened or closed, remembered across redraws and quiet reloads
/* sunrise and sunset worked out from the date and the station's coordinates (the standard NOAA sunrise equation, good to about a minute) */
function sunTimes(date,lat,lon){
  const [Y,M,D]=date.split("-").map(Number), R=Math.PI/180;
  const n=Math.round(Date.UTC(Y,M-1,D,12)/86400000+2440587.5-2451545.0);
  const js=n-lon/360, m=(357.5291+0.98560028*js)%360;
  const c=1.9148*Math.sin(m*R)+0.02*Math.sin(2*m*R)+0.0003*Math.sin(3*m*R);
  const lam=(m+c+180+102.9372)%360;
  const jt=2451545+js+0.0053*Math.sin(m*R)-0.0069*Math.sin(2*lam*R);
  const dec=Math.asin(Math.sin(lam*R)*Math.sin(23.4397*R));
  const co=(Math.sin(-0.833*R)-Math.sin(lat*R)*Math.sin(dec))/(Math.cos(lat*R)*Math.cos(dec));
  if(co>1||co<-1) return null;
  const w=Math.acos(co)/R, ep=j=>(j-2440587.5)*86400;
  return {rise:ep(jt-w/360), set:ep(jt+w/360)};
}
function sunLine(s,date,short){
  const t=(s&&s.lat!=null&&date)?sunTimes(date,s.lat,s.lon):null;
  if(!t) return "";
  const len=Math.round((t.set-t.rise)/60);
  const nb=x=>x.replace(/\s/g,"\u00a0");
  return "Sunrise "+nb(hhmm(t.rise,s.tz))+" · Sunset "+nb(hhmm(t.set,s.tz))+(short?"":" · "+Math.floor(len/60)+" h "+len%60+" min of daylight");
}
function recordInfo(s){ return ((DATA.records||{})[s.id])||null; }
function recordLine(s,d){
  const r=recordInfo(s), e=r&&r.days&&r.days[(d.date||"").slice(5)];
  if(!e||e[0]==null) return "";
  let t="Record high "+e[0]+"° ("+e[1]+") · Record low "+(e[2]==null?"–":e[2]+"° ("+e[3]+")");
  const hiRel=d.hi==null?0:Math.sign(Math.round(d.hi)-e[0]), loRel=(d.lo==null||e[2]==null)?0:Math.sign(e[2]-Math.round(d.lo));
  if(hiRel>0) t+=" · Your station beat the record high with "+fmt0(d.hi)+"°";
  else if(hiRel===0&&d.hi!=null) t+=" · Your station matched the record high";
  if(loRel>0) t+=" · Your station beat the record low with "+fmt0(d.lo)+"°";
  else if(loRel===0&&d.lo!=null) t+=" · Your station matched the record low";
  return t;
}

const SNOW=(DATA.snow&&DATA.snow.stations)||{};

const SNOW_PER_WATER=10;             // 10 in of snow is about 1 in of water

function snowToday(s){
  const x=SNOW[s.id], ck=DATA.snow&&DATA.snow.checked; if(!x||!ck||nowSec()-ck>SNOW_MAX_AGE) return null;
  try{
    const day=e=>new Intl.DateTimeFormat("en-CA",{timeZone:x.tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(e*1000));
    const today=day(nowSec());
    // an hour is labeled with the moment it ENDS, so the hour ending at midnight belongs to the day before
    return Math.round(x.hours.reduce((a,h)=>day(h[0]-1)===today?a+h[1]:a,0)*1000)/1000;
  }catch(e){ return x.today; }
}
const snowStr=v=>(Math.round(v*10)/10).toFixed(1);
/* rain from the station's gauge plus snow turned into water, one number */
function precipParts(s){
  const L=s.latest, sn=snowToday(s), rain=L.rainToday;

  return {rain, snow:sn, water, showSnow:sn!=null&&sn>=SNOW_SHOW};

/* ---------- weather alerts ---------- */
/* Saved by wx_alerts.py. A warning hides its matching watch only while the warning is active. The page also drops an alert at its own

const ALERTS=(DATA.alerts&&DATA.alerts.stations)||{};
const OPEN_KEY="wxAlertOpen";

function saveOpen(set){ try{ sessionStorage.setItem(OPEN_KEY,JSON.stringify([...set])); }catch(e){} }
function liveAlerts(sid){
  const st=ALERTS[sid]; if(!st) return [];
  const now=nowSec();
  const alive=(st.alerts||[]).filter(a=>a.end==null||a.end>now);
  const keys=new Set(alive.map(a=>a.key));
  return alive.filter(a=>!(a.supersededBy||[]).some(k=>keys.has(k)));
}
function pruneOpen(){
  const keep=new Set(); Object.keys(ALERTS).forEach(id=>liveAlerts(id).forEach(a=>keep.add(a.key)));
  const set=openSet(); let changed=false; set.forEach(k=>{ if(!keep.has(k)){ set.delete(k); changed=true; } }); if(changed) saveOpen(set);
}
function alertWhen(a,tz){
  const now=nowSec();
  const dayOf=ep=>new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"numeric",day:"numeric"}).format(new Date(ep*1000));
  const md=ep=>new Date(ep*1000).toLocaleDateString("en-US",{month:"numeric",day:"numeric",timeZone:tz});
  const when=(ep,zone)=>(dayOf(ep)===dayOf(now)?"":md(ep)+" ")+hhmm(ep,tz)+(zone?" "+zoneAbbr(ep,tz):"");
  const started=a.start==null||a.start<=now;
  if(a.end==null) return started?"no end time given":"from "+when(a.start,true);
  return started?"until "+when(a.end,true):"from "+when(a.start,false)+" until "+when(a.end,true);
}
function paragraphs(text){ return String(text||"").trim().split(/\n\s*\n/).map(x=>x.replace(/\s*\n\s*/g," ").trim()).filter(Boolean); }
function alertBox(a,s,open){
  const d=el("details","alertbox"); d.style.background=a.fill; d.style.color=a.fg; if(open) d.open=true;
  const sm=el("summary"); sm.appendChild(el("span","an",a.event)); sm.appendChild(el("span","at",alertWhen(a,s.tz))); d.appendChild(sm);

  d.appendChild(b);

    const list=liveAlerts(s.id), nsig=list.map(a=>a.key+"|"+alertWhen(a,s.tz)).join(";");
    if(nsig===sig) return; sig=nsig;

  };

}

  const checked=sts.map(x=>x.checked).filter(v=>v!=null), oldest=checked.length?Math.min(...checked):null;
  const when=oldest==null?"never":hhmm(oldest)+" "+zoneAbbr(oldest), age=oldest==null?null:(nowSec()-oldest)/60;

  else if(age!=null&&age>15){ n.className="upd warn"; n.textContent="Alerts last checked "+when+" ("+ageText(age)+")"; }

}

function fmtDur(sec){ const m=sec/60; if(m<90) return Math.max(0,Math.round(m))+" min"; const h=m/60; if(h<48) return Math.round(h)+" h"; return (h/24).toFixed(1)+" d"; }
/* Reporting health looks back 30 days from the station's newest reading, no further. */
const HEALTH_DAYS=30;
function clearInfo(s){
  const L=s.latest, st=statusOf(s), cutoff=L.epoch-HEALTH_DAYS*86400;

  const dur=L.epoch-(lastAll?lastAll.e1:s.hourly[0][0]);
  if(dur>=HEALTH_DAYS*86400) return {quiet:false, over:true, text:HEALTH_DAYS+"+ days", last:null, recent};
  return {quiet:false, text:fmtDur(dur)+(lastAll?"":", no outages yet"), last:lastAll, recent};
}

/* ---- dials (drawn here, no outside images) ---- */
const TEMP_MIN=-20, TEMP_MAX=120;
const clamp01=v=>Math.max(0,Math.min(1,v));
const OFF_SCALE="off-scale reading";
const offDial=(...vs)=>{ const v=vs.filter(x=>x!=null); return v.some(x=>x<TEMP_MIN||x>TEMP_MAX)? OFF_SCALE : ""; };
function arcPt(cx,cy,r,f){ const a=Math.PI*(1-f); return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; }
function arcPath(cx,cy,r,f0,f1){ const a=arcPt(cx,cy,r,f0), b=arcPt(cx,cy,r,f1); return `M${a[0].toFixed(1)} ${a[1].toFixed(1)}A${r} ${r} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; }
function gzSvg(label){ const g=sv("svg",{viewBox:"0 0 120 84",class:"gz",role:"img","aria-label":label}); return g; }
const TEMP_STOPS=[[0,"#82e2ff"],[0.42,"#61ffca"],[0.7,"#ffca85"],[1,"#ff6767"]];
function mixHex(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const x=p(a), y=p(b); return "#"+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
function tempColor(v){
  if(v==null) return "var(--ink)";
  const f=clamp01((v-TEMP_MIN)/(TEMP_MAX-TEMP_MIN));
  for(let i=1;i<TEMP_STOPS.length;i++){ if(f<=TEMP_STOPS[i][0]){ const [a,ca]=TEMP_STOPS[i-1], [b,cb]=TEMP_STOPS[i]; return mixHex(ca,cb,(f-a)/(b-a)); } }
  return TEMP_STOPS[TEMP_STOPS.length-1][1];
}
function gradDefs(svg,id){ const d=sv("defs"); const lg=sv("linearGradient",{id:id,gradientUnits:"userSpaceOnUse",x1:12,y1:0,x2:108,y2:0});
  TEMP_STOPS.forEach(([o,c])=>lg.appendChild(sv("stop",{offset:o,"stop-color":c}))); d.appendChild(lg); svg.appendChild(d); }
function tempArc(svg,id,val,lo,hi){
  gradDefs(svg,id); const cx=60,cy=70,r=46, f=v=>clamp01((v-TEMP_MIN)/(TEMP_MAX-TEMP_MIN));
  if(lo!=null&&hi!=null){
    svg.appendChild(sv("path",{d:arcPath(cx,cy,r,0,1),fill:"none",stroke:"url(#"+id+")","stroke-width":9,"stroke-linecap":"round",opacity:.2}));
    svg.appendChild(sv("path",{d:arcPath(cx,cy,r,f(lo),Math.max(f(hi),f(lo)+0.02)),fill:"none",stroke:"url(#"+id+")","stroke-width":9,"stroke-linecap":"round"}));
  } else if(val!=null){
    svg.appendChild(sv("path",{d:arcPath(cx,cy,r,0,1),fill:"none",stroke:"url(#"+id+")","stroke-width":9,"stroke-linecap":"round"}));
    const off=val<TEMP_MIN?"#82e2ff":val>TEMP_MAX?"#ff6767":null;
    const m=arcPt(cx,cy,r,f(val)); svg.appendChild(sv("circle",{cx:m[0],cy:m[1],r:off?7:6,fill:"#edecee",stroke:off||"#232230","stroke-width":off?4:2.5}));
  }
  [[0,String(TEMP_MIN)],[1,String(TEMP_MAX)]].forEach(([ff,t])=>{ const p=arcPt(cx,cy,r,ff); const tx=sv("text",{x:p[0],y:p[1]+14,"text-anchor":"middle"}); tx.textContent=t; svg.appendChild(tx); });
}
function gaugeFor(s,k){
  const L=s.latest, svg=gzSvg(METRIC_LABEL[k]);

/* ---- forecast icons (own drawings) ---- */
function iconKind(code){

  if([31,33].includes(code)) return "moon";
  if([28,30].includes(code)) return "partday";
  if([27,29].includes(code)) return "partnight";
  if([3,4,37,38,47,0,1,2].includes(code)) return "storm";
  if([9,11,12,39,40,45,35].includes(code)) return "rain";
  if([13,14,15,16,41,42,43,46].includes(code)) return "snow";
  if([5,6,7,8,10,17,18].includes(code)) return "mix";

  frzr:[[254,222,207],[252,194,170],[252,149,118],[251,120,88],[242,71,52],[222,43,37],[182,19,25],[148,11,19]],
  sleet:[[238,236,244],[222,221,237],[190,191,221],[169,167,207],[136,133,190],[118,105,175],[94,58,152],[78,28,138]] };

      else d[i*4+3]=0; } }

}

  if(state.range==="custom"){ dFrom.value=state.from; dTo.value=state.to; }
  const applyDates=changed=>{
    let f=dFrom.value, t=dTo.value; if(!f&&!t) return;
    if(!t) t=f; if(!f) f=t;
    if(changed==="from"&&f>t) t=f; if(changed==="to"&&t<f) f=t;
    if(f<minD) f=minD; if(f>maxD) f=maxD; if(t<minD) t=minD; if(t>maxD) t=maxD; if(t<f) t=f;
    dFrom.value=f; dTo.value=t; state.range="custom"; state.from=f; state.to=t; setHash(); mk(); render();
  };
  dFrom.addEventListener("change",()=>applyDates("from")); dTo.addEventListener("change",()=>applyDates("to"));
  document.getElementById("dClear").addEventListener("click",()=>{ state.range="today"; dFrom.value=dTo.value=""; setHash(); mk(); closeDates(); if(phone()) closePanel(); render(); });
  dateBtn.addEventListener("click",e=>{ e.stopPropagation(); const o=!datePop.classList.contains("open"); datePop.classList.toggle("open",o); dateBtn.setAttribute("aria-expanded",o); });
  datePop.addEventListener("click",e=>e.stopPropagation());
  fbtn.addEventListener("click",e=>{ e.stopPropagation(); const o=!fpanel.classList.contains("open"); fpanel.classList.toggle("open",o); fbtn.setAttribute("aria-expanded",o); status(); });
  document.addEventListener("click",e=>{ if(!phone()) closeDates(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeDates(); closePanel(); } });
  sel.addEventListener("change",()=>{ state.station=sel.value; state.metric="temp"; setHash(); status(); if(phone()) closePanel(); render(); });
  mk();
  document.getElementById("stationsLine").textContent=ST.map(short).join(" · ");
  document.getElementById("foot").textContent="Source: Weather Underground personal weather station data, history collected every 15 minutes by wu_collect.py and saved in monthly CSV files, plus a live reading every 5 minutes for the Right now cards. Forecast: National Weather Service. Alerts: National Weather Service (api.weather.gov), checked every 5 minutes for each station's chosen address by wx_alerts.py. Pressure is the average of each 5-minute min and max, so it is rounded to 0.1 in. Right now cards use a live reading when it is newer than the saved history. Page built "+stamp(BUILT)+" "+zoneAbbr(BUILT)+" · history saved since "+((d)=>{const p=d.split("-"); return (+p[1])+"/"+(+p[2]);})(DATA.start)+".";
  const view=restoreView();
  initRefresh();
  render();
  if(view&&view.y) setTimeout(()=>window.scrollTo(0,view.y),80);
  initAutoUpdate(); setInterval(()=>UPDATERS.forEach(f=>f()),60000); let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(render,200); });
}
function initRefresh(){
  const btn=document.getElementById("refreshBtn"), msg=document.getElementById("refreshMsg");
  /* On the public web copy (https, not this PC) there is no helper to refresh, so hide the button and its note. */
  if(location.protocol==="https:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){ btn.style.display="none"; msg.style.display="none"; }
  /* How To Guide opens in a new tab with window.open (not a plain link) so the guide knows who opened it and can show its Close button */
  document.getElementById("guideBtn").addEventListener("click",()=>{ const u="docx/Scattered_Showers_Guide.html"; let w=null; try{ w=window.open(u,"_blank"); }catch(e){} if(!w) location.href=u; });
  document.getElementById("updAt").textContent="Updated "+hhmm(BUILT);
  let kept=null; try{ kept=sessionStorage.getItem("wxRefreshMsg"); sessionStorage.removeItem("wxRefreshMsg"); }catch(e){}
  if(kept){ msg.className="err"; msg.textContent=kept; }
  if(location.protocol==="file:" && !kept) msg.textContent="Refresh needs the helper: open the dashboard with start_dashboard.bat.";
  btn.addEventListener("click",async()=>{
    if(location.protocol==="file:"){ msg.className="err"; msg.textContent="This page was opened from a file, and browsers do not let a file run programs. Close it and double-click start_dashboard.bat instead, then the button works."; return; }
    btn.disabled=true; REFRESHING=true; msg.className=""; msg.textContent="Refreshing, about 20 seconds...";
    try{
      const r=await fetch("/refresh",{method:"POST"}); const j=await r.json();
      if(j.ok){
        const line=j.collector||"", bad=!j.collectorOk||/NOTES|FAILED/.test(line);
        try{ if(bad) sessionStorage.setItem("wxRefreshMsg","Refreshed, with a problem: "+line); }catch(e){}
        saveView(); location.reload(); return;
      }
      msg.className="err"; msg.textContent="Refresh failed: "+(j.error||j.build||"unknown error");
    }catch(e){ msg.className="err"; msg.textContent="Could not reach the helper. Is the start_dashboard.bat window still open?"; }
    btn.disabled=false; REFRESHING=false;
  });
}
/* Quiet auto-update: once a minute, read a tiny file with the build time. Reload only when a newer build is there,
   and never while a menu is open or a box is being used. This asks the helper on this PC, never Weather Underground. */
let REFRESHING=false;
function initAutoUpdate(){
  if(location.protocol==="file:") return;
  const busyUI=()=>{ const open=id=>{ const e=document.getElementById(id); return e&&e.classList.contains("open"); }; const a=document.activeElement; return open("datePop")||open("fpanel")||(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); };
  const tick=async()=>{
    if(REFRESHING) return;
    try{
      const r=await fetch("dataSource/meta.json",{cache:"no-store"}); if(!r.ok) return;
      const m=await r.json();
      if(m&&m.built&&Date.parse(m.built)>Date.parse(DATA.built)&&!busyUI()&&!REFRESHING){ saveView(); location.reload(); }
    }catch(e){}
  };
  setInterval(tick,60000);
}
init();
</script>
