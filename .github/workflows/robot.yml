# The robot's instructions. GitHub reads this file from .github/workflows/robot.yml (scr/publish.py copies it there).
# One run = scr/robot.py (collect, build, check, save data) and then publish the page.
#
# No timer in this file. GitHub's own timer never fired for this repo (1 run in about 11 hours), so it was removed on 2026-10-31.
# A Cloudflare Worker named scattered-showers-pinger (code: scr/pinger_worker.js) presses "Run workflow" every 5 minutes.
# It can still be started by hand with "Run workflow" (untick Dry run to really publish).
#
# 2026-11-05: the live page froze at the 05:31 UTC build while every run, deploy and data save still reported success.
# Every deploy in that stretch used the same commit (ed61027) as its Pages version, 463 deploys before the freeze.
# Publishing a new commit gives the next deploys a new version. If it freezes again, count the deploys since the last commit.
# 2026-11-06: it froze again at the 19:26 UTC build, after only about 86 deploys of the bot commit 77ea3e1. So the deploy count is not the whole story.
# The deploy step's "Reported success" is a status lookup by commit ID, so it can be an old success. Trust the page's own built time instead.

name: Scattered Showers robot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: do everything except save the data and publish the page"
        type: boolean
        default: true
      force_collect:
        description: "Fetch new readings even if the last fetch was recent"
        type: boolean
        default: false
      allow_empty_data:
        description: "Start a new empty data branch if none exists (loses nothing only if you mean to start from scratch)"
        type: boolean
        default: false

permissions:
  contents: write   # save data to the data branch
  pages: write      # publish the page
  id-token: write   # needed by the publish step

# One robot run at a time. A newer run waits instead of cancelling the one in progress.
concurrency:
  group: scattered-showers-robot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the two helper libraries
        run: python -m pip install -r requirements.txt

      - name: Run the robot
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          NWS_CONTACT: ${{ secrets.NWS_CONTACT }}
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_COLLECT: ${{ inputs.force_collect }}
          ALLOW_EMPTY_DATA: ${{ inputs.allow_empty_data }}
        run: python scr/robot.py

      - name: Set up Pages
        # skipped on a dry run, so a trial works before the Pages setting is switched
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        uses: actions/configure-pages@v6

      - name: Package the page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # publish unless it is a dry run started by hand (timer runs always publish)
    if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.fallback.outputs.page_url }}
    steps:
      # 2026-11-06: the deploy action labels each deploy with the commit ID, and GitHub uses that label as the deployment's ID.
      # So hundreds of deploys shared one ID, and "Reported success" was a lookup of that shared ID.
      # This gives every deploy its own label: a hash of the commit ID, the run ID and the attempt number (still 40 characters, like a commit ID).
      - name: Make a one-time label for this deploy
        id: label
        run: |
          label=$(printf '%s-%s-%s' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -d' ' -f1)
          echo "value=$label" >> "$GITHUB_OUTPUT"
          echo "commit $GITHUB_SHA, run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT -> label $label"
          # A step cannot overwrite GITHUB_SHA (tried 2026-11-06, the runner ignored it). So write a tiny file that Node runs first
          # and that changes GITHUB_SHA from inside the deploy action's own process.
          cat > "$RUNNER_TEMP/wx_label.js" <<'JS'
          if (process.env.WX_DEPLOY_LABEL) {
            process.env.GITHUB_SHA = process.env.WX_DEPLOY_LABEL;
            console.log('wx_label.js: GITHUB_SHA is now ' + process.env.GITHUB_SHA);
          }
          JS

      - name: Publish the page
        id: deployment
        # if GitHub refuses the label, the next step publishes the old way so the page still updates
        continue-on-error: true
        env:
          WX_DEPLOY_LABEL: ${{ steps.label.outputs.value }}
          NODE_OPTIONS: --require ${{ runner.temp }}/wx_label.js
        uses: actions/deploy-pages@v5

      - name: Publish the page (old way, only if the one above failed)
        id: fallback
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
